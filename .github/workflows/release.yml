name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Bump SemVer, or release the current committed version"
        type: choice
        options:
          - patch
          - minor
          - major
          - current
        default: patch
      recover_unpublished:
        description: "current only: replace an old tag; I verified NO pending/approved npm stage, published version, or GitHub Release"
        type: boolean
        default: false

permissions:
  actions: write
  contents: write
  id-token: write

concurrency:
  # Prepare and stage runs use separate groups so a newly queued run can never
  # replace a pending chained stage run.
  group: release-${{ inputs.release_type == 'current' && 'stage' || 'prepare' }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'rozsazoltan/opencode-shell' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use npm with OIDC support
        run: npm install --global 'npm@^11.15.0'

      # Bump choices prepare a release (bump, commit, tag, dispatch);
      # current stages the committed version without a version change or commit.
      - name: Determine mode
        id: mode
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          RECOVER_UNPUBLISHED: ${{ inputs.recover_unpublished }}
        run: |
          case "$RECOVER_UNPUBLISHED" in
            true) test "$RELEASE_TYPE" = current ;;
            false) ;;
            *) echo 'Invalid recovery confirmation' >&2; exit 1 ;;
          esac
          case "$RELEASE_TYPE" in
            current) echo 'mode=stage' >> "$GITHUB_OUTPUT" ;;
            patch | minor | major) echo 'mode=prepare' >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported release type: $RELEASE_TYPE" >&2; exit 1 ;;
          esac

      # ---------------- prepare mode ----------------

      - name: Preflight (prepare)
        if: steps.mode.outputs.mode == 'prepare'
        run: |
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/master | cut -f1)"
          npm view @rozsazoltan/opencode-shell versions --json > "$RUNNER_TEMP/npm-versions.json"
          npm view @rozsazoltan/opencode-shell dist-tags.latest --json > "$RUNNER_TEMP/npm-latest.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'

          const packageName = '@rozsazoltan/opencode-shell'
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'))
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'))
          if (manifest.name !== packageName || lock.name !== packageName ||
              lock.packages?.['']?.name !== packageName ||
              manifest.version !== lock.version || manifest.version !== lock.packages?.['']?.version) {
            throw new Error('Package name/version does not match the lockfile')
          }
          const published = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/npm-versions.json`, 'utf8'))
          const versions = new Set(Array.isArray(published) ? published : [published])
          if (!versions.size) throw new Error('Publish the bootstrap package locally first')
          const npmLatest = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/npm-latest.json`, 'utf8'))

          const parseTag = tag => {
            const match = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(tag)
            if (!match) return
            const numbers = match.slice(1).map(Number)
            return numbers.every(Number.isSafeInteger) ? numbers : undefined
          }
          const compare = (x, y) => x[0] - y[0] || x[1] - y[1] || x[2] - y[2]
          const version = manifest.version
          const tag = `v${version}`
          if (!parseTag(tag)) throw new Error(`Invalid SemVer version ${version}`)
          const tags = execFileSync('git', ['tag', '--list', 'v*'], { encoding: 'utf8' })
            .split('\n').filter(tag => parseTag(tag))
            .sort((a, b) => compare(parseTag(a), parseTag(b)))
          const latest = tags.at(-1)
          if (!latest || !versions.has('0.1.0') || !tags.includes('v0.1.0')) {
            throw new Error('Publish version 0.1.0 locally and push tag v0.1.0 first')
          }
          const npmLatestVersion = parseTag(`v${npmLatest}`)
          if (typeof npmLatest !== 'string' || !npmLatestVersion) {
            throw new Error(`Invalid npm latest dist-tag version: ${npmLatest}`)
          }
          if (compare(npmLatestVersion, parseTag(latest)) > 0) {
            throw new Error(`npm latest version ${npmLatest} is ahead of the latest release tag ${latest}`)
          }
          const bootstrap = JSON.parse(execFileSync('git', ['show', 'v0.1.0:package.json'], { encoding: 'utf8' }))
          if (bootstrap.name !== packageName || bootstrap.version !== '0.1.0') {
            throw new Error('Bootstrap tag does not point to the published package version')
          }
          if (compare(parseTag(tag), parseTag(latest)) < 0 ||
              compare(parseTag(tag), npmLatestVersion) < 0) {
            throw new Error('Committed version is behind the latest Git tag or npm latest')
          }
          console.log(`Preparing a release from committed version ${version}`)
          NODE

      - name: Compute next version
        id: bump
        if: steps.mode.outputs.mode == 'prepare'
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          case "$RELEASE_TYPE" in
            patch | minor | major) ;;
            *) echo "Unsupported release type: $RELEASE_TYPE" >&2; exit 1 ;;
          esac
          npm version "$RELEASE_TYPE" --no-git-tag-version
          VERSION="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; process.stdout.write(JSON.parse(readFileSync("package.json", "utf8")).version)')"
          LOCK_VERSION="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; process.stdout.write(JSON.parse(readFileSync("package-lock.json", "utf8")).version)')"
          LOCK_PACKAGE_VERSION="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; process.stdout.write(String(JSON.parse(readFileSync("package-lock.json", "utf8")).packages?.[""]?.version))')"
          if [ "$LOCK_VERSION" != "$VERSION" ] || [ "$LOCK_PACKAGE_VERSION" != "$VERSION" ]; then
            echo "Lockfile version mismatch after bump: $LOCK_VERSION / $LOCK_PACKAGE_VERSION" >&2
            exit 1
          fi
          if git tag --list "v$VERSION" | grep -q .; then
            echo "Tag v$VERSION already exists locally" >&2
            exit 1
          fi
          if git ls-remote --tags origin | awk '{print $2}' | grep -qx "refs/tags/v$VERSION"; then
            echo "Tag v$VERSION already exists on origin" >&2
            exit 1
          fi
          if node --input-type=module -e 'import { readFileSync } from "node:fs"; const v = JSON.parse(readFileSync(process.argv[1], "utf8")); process.exit((Array.isArray(v) ? v : [v]).includes(process.argv[2]) ? 0 : 1)' "$RUNNER_TEMP/npm-versions.json" "$VERSION"; then
            echo "Version $VERSION is already published on npm" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Next version: v$VERSION"

      - name: Commit, tag, and push
        if: steps.mode.outputs.mode == 'prepare'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          test -n "$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m "chore(release): v$VERSION"
          git push origin HEAD:refs/heads/master
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "refs/tags/v$VERSION"

      - name: Dispatch staging run
        if: steps.mode.outputs.mode == 'prepare'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          gh workflow run release.yml --ref master -f release_type=current
          echo "Dispatched the stage run for v$VERSION"

      - name: Prepare summary
        if: steps.mode.outputs.mode == 'prepare'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          echo "Prepared v$VERSION: pushed the release commit and tag to master and dispatched the stage run."
          {
            echo '### Release prepared'
            echo ''
            echo "- Bumped to v${VERSION}"
            echo '- Pushed the release commit and tag to master'
            echo '- Dispatched the stage run; npm approval remains manual'
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------- stage mode ----------------

      - name: Preflight (stage)
        id: preflight
        if: steps.mode.outputs.mode == 'stage'
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVER_UNPUBLISHED: ${{ inputs.recover_unpublished }}
        run: |
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/master | cut -f1)"
          npm view @rozsazoltan/opencode-shell versions --json > "$RUNNER_TEMP/npm-versions.json"
          npm view @rozsazoltan/opencode-shell dist-tags.latest --json > "$RUNNER_TEMP/npm-latest.json"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'

          const packageName = '@rozsazoltan/opencode-shell'
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'))
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'))
          const version = manifest.version
          if (manifest.name !== packageName || lock.name !== packageName ||
              lock.packages?.['']?.name !== packageName ||
              lock.version !== version || lock.packages?.['']?.version !== version) {
            throw new Error('Package name/version does not match the lockfile')
          }
          const published = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/npm-versions.json`, 'utf8'))
          if (!(Array.isArray(published) ? published : [published]).every(value => typeof value === 'string' && value.length > 0)) {
            throw new Error('Could not verify public npm versions')
          }
          const versions = new Set(Array.isArray(published) ? published : [published])
          if (!versions.size) throw new Error('Publish the bootstrap package locally first')
          const npmLatest = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/npm-latest.json`, 'utf8'))

          const parseTag = tag => {
            const match = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(tag)
            if (!match) return
            const numbers = match.slice(1).map(Number)
            return numbers.every(Number.isSafeInteger) ? numbers : undefined
          }
          const compare = (x, y) => x[0] - y[0] || x[1] - y[1] || x[2] - y[2]
          const tag = `v${version}`
          if (!parseTag(tag)) throw new Error(`Invalid SemVer version ${version}`)
          const tags = execFileSync('git', ['tag', '--list', 'v*'], { encoding: 'utf8' })
            .split('\n').filter(tag => parseTag(tag))
            .sort((a, b) => compare(parseTag(a), parseTag(b)))
          const latest = tags.at(-1)
          if (!latest || !versions.has('0.1.0') || !tags.includes('v0.1.0')) {
            throw new Error('Publish version 0.1.0 locally and push tag v0.1.0 first')
          }
          const npmLatestVersion = parseTag(`v${npmLatest}`)
          if (typeof npmLatest !== 'string' || !npmLatestVersion) {
            throw new Error(`Invalid npm latest dist-tag version: ${npmLatest}`)
          }
          if (compare(npmLatestVersion, parseTag(latest)) > 0) {
            throw new Error(`npm latest version ${npmLatest} is ahead of the latest release tag ${latest}`)
          }
          const bootstrap = JSON.parse(execFileSync('git', ['show', 'v0.1.0:package.json'], { encoding: 'utf8' }))
          if (bootstrap.name !== packageName || bootstrap.version !== '0.1.0') {
            throw new Error('Bootstrap tag does not point to the published package version')
          }
          // Existing tags must identify the exact source about to be attested.
          // Only explicit unpublished recovery may replace an older ancestor tag.
          const recover = process.env.RECOVER_UNPUBLISHED === 'true'
          const tagExists = tags.includes(tag)
          const remoteTag = execFileSync('git', ['ls-remote', '--tags', 'origin', `refs/tags/${tag}`], { encoding: 'utf8' }).trim()
          const localTag = tagExists
            ? execFileSync('git', ['rev-parse', `refs/tags/${tag}`], { encoding: 'utf8' }).trim()
            : undefined
          if (remoteTag !== (tagExists ? `${localTag}\trefs/tags/${tag}` : '')) {
            throw new Error(`Remote tag ${tag} differs from checkout; refusing to create or replace it`)
          }
          const tagCommit = tagExists
            ? execFileSync('git', ['rev-parse', `${tag}^{commit}`], { encoding: 'utf8' }).trim()
            : undefined
          if (tagExists) {
            const taggedManifest = JSON.parse(execFileSync('git', ['show', `${tag}:package.json`], { encoding: 'utf8' }))
            const taggedLock = JSON.parse(execFileSync('git', ['show', `${tag}:package-lock.json`], { encoding: 'utf8' }))
            if (taggedManifest.name !== packageName || taggedManifest.version !== version ||
                taggedLock.name !== packageName || taggedLock.version !== version ||
                taggedLock.packages?.['']?.name !== packageName || taggedLock.packages?.['']?.version !== version) {
              throw new Error(`Tag ${tag} does not identify the same package/version and consistent lockfile`)
            }
          }
          if (compare(parseTag(tag), parseTag(latest)) < 0 ||
              compare(parseTag(tag), npmLatestVersion) < 0) {
            throw new Error('Staged version is behind the latest Git tag or npm latest')
          }
          // GraphQL returns null for a missing release; authentication/API errors fail the preflight.
          const releaseResponse = JSON.parse(execFileSync('gh', [
            'api', 'graphql',
            '-f', 'query=query($owner:String!,$repo:String!,$tag:String!){repository(owner:$owner,name:$repo){release(tagName:$tag){tagName}}}',
            '-f', 'owner=rozsazoltan', '-f', 'repo=opencode-shell', '-f', `tag=${tag}`,
          ], { encoding: 'utf8' }))
          if (releaseResponse.errors?.length || !releaseResponse.data?.repository ||
              (releaseResponse.data.repository.release !== null &&
               releaseResponse.data.repository.release?.tagName !== tag)) {
            throw new Error(`Could not verify GitHub Release for ${tag}`)
          }
          const releaseExists = releaseResponse.data.repository.release !== null
          if (recover && (releaseExists || versions.has(version))) {
            throw new Error('Unpublished recovery refuses any existing GitHub Release or publicly published npm version')
          }
          if (!tagExists && (releaseExists || versions.has(version))) {
            throw new Error(`Missing tag ${tag} for an existing release or published version; manual recovery required`)
          }
          // Only public registry publication is evidence for repair without staging.
          // A reserved staged version or an existing Release is not such evidence.
          // npm OIDC tokens cannot list/view stages; an unknown stage is not skipped.
          const action = versions.has(version) ? (releaseExists ? 'complete' : 'repair-release') : 'stage'
          let tagAction = tagExists ? 'none' : 'create'
          if (action === 'stage' && tagExists && tagCommit !== process.env.GITHUB_SHA) {
            if (!recover) {
              throw new Error(`${tag} does not point to the workflow SHA; choose a bump or explicitly confirm unpublished recovery after checking npm stages manually`)
            }
            execFileSync('git', ['merge-base', '--is-ancestor', tagCommit, process.env.GITHUB_SHA])
            tagAction = 'replace'
          }
          // Published retries never stage or move tags, even if master has advanced.
          appendFileSync(process.env.GITHUB_OUTPUT, `action=${action}\ntag=${tag}\nrelease_exists=${releaseExists}\ntag_action=${tagAction}\nexpected_tag=${localTag ?? ''}\n`)
          console.log(`${action}: ${version}`)
          if (action === 'stage') console.log('Not publicly published; existing npm stage status cannot be checked with OIDC. Staging errors will fail this run.')
          NODE

      - name: Install and check package
        if: steps.mode.outputs.mode == 'stage' && steps.preflight.outputs.action == 'stage'
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Pack current version
        if: steps.mode.outputs.mode == 'stage' && steps.preflight.outputs.action == 'stage'
        run: |
          npm run build --if-present
          npm pack --dry-run

      - name: Create or recover unpublished version tag
        if: steps.mode.outputs.mode == 'stage' && steps.preflight.outputs.action == 'stage' && steps.preflight.outputs.tag_action != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.preflight.outputs.tag }}
          TAG_ACTION: ${{ steps.preflight.outputs.tag_action }}
          EXPECTED_TAG: ${{ steps.preflight.outputs.expected_tag }}
          RECOVER_UNPUBLISHED: ${{ inputs.recover_unpublished }}
        run: |
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "$(git ls-remote origin refs/heads/master | cut -f1)"
          case "$TAG_ACTION" in
            create) test -z "$EXPECTED_TAG" ;;
            replace)
              test "$RECOVER_UNPUBLISHED" = true
              test -n "$EXPECTED_TAG"
              test "$(git rev-parse "refs/tags/$TAG")" = "$EXPECTED_TAG"
              git merge-base --is-ancestor "$TAG^{commit}" "$GITHUB_SHA"
              ;;
            *) echo 'Invalid tag action' >&2; exit 1 ;;
          esac
          # Recheck public state after checks/packing, just before changing any tag.
          # npm stage absence is the operator's explicit confirmation, never inferred.
          npm view @rozsazoltan/opencode-shell versions --json > "$RUNNER_TEMP/npm-versions.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'

          const tag = process.env.TAG
          const published = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/npm-versions.json`, 'utf8'))
          const versions = Array.isArray(published) ? published : [published]
          if (!versions.length || !versions.every(value => typeof value === 'string' && value.length > 0) || !versions.includes('0.1.0')) {
            throw new Error('Could not verify public npm versions')
          }
          if (versions.includes(tag.slice(1))) throw new Error('Version became publicly published; refusing to change its tag')
          const response = JSON.parse(execFileSync('gh', [
            'api', 'graphql',
            '-f', 'query=query($owner:String!,$repo:String!,$tag:String!){repository(owner:$owner,name:$repo){release(tagName:$tag){tagName}}}',
            '-f', 'owner=rozsazoltan', '-f', 'repo=opencode-shell', '-f', `tag=${tag}`,
          ], { encoding: 'utf8' }))
          if (response.errors?.length || !response.data?.repository || response.data.repository.release !== null) {
            throw new Error('GitHub Release exists or could not be checked; refusing to change its tag')
          }
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$TAG_ACTION" = replace ]; then
            git tag -f -a "$TAG" "$GITHUB_SHA" -m "$TAG"
          else
            git tag -a "$TAG" "$GITHUB_SHA" -m "$TAG"
          fi
          git push --atomic --force-with-lease="refs/tags/$TAG:$EXPECTED_TAG" origin "refs/tags/$TAG:refs/tags/$TAG"

      - name: Stage package for npm approval
        if: steps.mode.outputs.mode == 'stage' && steps.preflight.outputs.action == 'stage'
        env:
          TAG: ${{ steps.preflight.outputs.tag }}
        run: |
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "$(git ls-remote origin refs/heads/master | cut -f1)"
          test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA"
          test "$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)" = "$(git rev-parse "refs/tags/$TAG")"
          npm stage publish --provenance --access public --tag latest
          echo 'Approve this staged package at https://www.npmjs.com/settings/rozsazoltan/staged-packages'

      - name: Create GitHub Release
        if: steps.mode.outputs.mode == 'stage' && (steps.preflight.outputs.action == 'stage' || steps.preflight.outputs.action == 'repair-release') && steps.preflight.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.preflight.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --generate-notes
